spring.application.name=Shipment

spring.datasource.url=jdbc:h2:mem:shipmentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

server.port=8080
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.bootstrap-admin.email=${SHIPMENT_ADMIN_EMAIL:}
app.bootstrap-admin.password=${SHIPMENT_ADMIN_PASSWORD:}
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
app.jwt.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:4200/reset-password}
app.password-reset.log-link=${PASSWORD_RESET_LOG_LINK:false}
