<main class="flex min-h-screen items-center justify-center bg-zinc-950 px-4 py-12">
  <section class="w-full max-w-md rounded-xl border border-zinc-800 bg-zinc-900 p-8 shadow-xl">
    <div class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-widest text-cyan-400">Shipment Tracker</p>
      <h1 class="mt-3 text-2xl font-bold text-white">Connexion</h1>
      <p class="mt-2 text-sm text-zinc-400">Connectez-vous pour gérer les expéditions.</p>
    </div>

    @if (authService.error()) {
      <div role="alert" class="mb-5 rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-300">
        {{ authService.error() }}
      </div>
    }

    <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="submit()">
      <label class="block space-y-2 text-sm text-zinc-300">
        <span>Adresse e-mail</span>
        <input
          class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2.5 text-white outline-none focus:border-cyan-500"
          type="email"
          autocomplete="username"
          formControlName="email"
        />
      </label>

      <label class="block space-y-2 text-sm text-zinc-300">
        <span>Mot de passe</span>
        <input
          class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2.5 text-white outline-none focus:border-cyan-500"
          type="password"
          autocomplete="current-password"
          formControlName="password"
        />
      </label>

      <button
        class="w-full rounded-lg bg-cyan-600 px-4 py-2.5 font-semibold text-white transition hover:bg-cyan-500 disabled:cursor-not-allowed disabled:opacity-50"
        type="submit"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <div class="mt-6 flex justify-between text-sm">
      <a routerLink="/register" class="text-cyan-400 hover:text-cyan-300">Créer un compte client</a>
      <a routerLink="/reset-password" class="text-zinc-400 hover:text-white">Mot de passe oublié ?</a>
    </div>
  </section>
</main>
