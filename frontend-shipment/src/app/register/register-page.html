<main class="flex min-h-screen items-center justify-center bg-zinc-950 px-4 py-12">
  <section class="w-full max-w-md rounded-xl border border-zinc-800 bg-zinc-900 p-8 shadow-xl">
    <p class="text-sm font-semibold uppercase tracking-widest text-cyan-400">Shipment Tracker</p>
    <h1 class="mt-3 text-2xl font-bold text-white">Créer un compte client</h1>
    <p class="mt-2 text-sm text-zinc-400">Votre compte sera limité au rôle client.</p>

    @if (authService.error()) {
      <div role="alert" class="mt-5 rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-300">
        {{ authService.error() }}
      </div>
    }

    <form class="mt-6 space-y-5" [formGroup]="registerForm" (ngSubmit)="submit()">
      <label class="block space-y-2 text-sm text-zinc-300">
        <span>Nom complet</span>
        <input class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2.5 text-white"
          autocomplete="name" formControlName="fullName" />
      </label>
      <label class="block space-y-2 text-sm text-zinc-300">
        <span>Adresse e-mail</span>
        <input class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2.5 text-white"
          type="email" autocomplete="email" formControlName="email" />
      </label>
      <label class="block space-y-2 text-sm text-zinc-300">
        <span>Mot de passe (12 caractères minimum)</span>
        <input class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2.5 text-white"
          type="password" autocomplete="new-password" formControlName="password" />
      </label>
      <button class="w-full rounded-lg bg-cyan-600 px-4 py-2.5 font-semibold text-white hover:bg-cyan-500 disabled:opacity-50"
        type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-zinc-400">
      Déjà inscrit ?
      <a routerLink="/login" class="text-cyan-400 hover:text-cyan-300">Se connecter</a>
    </p>
  </section>
</main>
